services:
  db:
    image: postgres:16-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: prueba
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prueba -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
